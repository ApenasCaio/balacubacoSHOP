<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suporte - BalacubacoSHOP</title>
<link rel="icon" href="/images/logo.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main class="container">
  <div class="card form-narrow">
    <h1 class="mt-0 center">Fale conosco</h1>
    <p class="text-muted center">Duvidas, trocas ou reclamacoes? Nossa equipe responde em ate 24h.</p>
    <div id="support-alert"></div>
    <form id="support-form">
      <label>Nome</label>
      <input type="text" id="name" required>
      <label>Email</label>
      <input type="email" id="email" required>
      <label>Assunto</label>
      <input type="text" id="subject" required>
      <label>Mensagem</label>
      <textarea id="message" required></textarea>
      <button class="btn btn-primary btn-block" type="submit">Enviar mensagem</button>
    </form>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/app.js"></script>
<script src="/js/suporte.js"></script>
</body>
</html>
