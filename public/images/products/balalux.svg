<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bulbGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="50%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ffc93c"/>
    </linearGradient>
    <linearGradient id="screwBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#ffc93c" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Light Glow Circle -->
  <circle cx="200" cy="150" r="95" fill="url(#bulbGlass)" filter="url(#glow)"/>
  <!-- Bulb Neck -->
  <path d="M 140 195 C 140 240, 160 260, 165 275 L 235 275 C 240 260, 260 240, 260 195 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <!-- RGB Spectrum Arc -->
  <path d="M 160 150 A 40 40 0 0 1 240 150" fill="none" stroke="#5b2a86" stroke-width="4" stroke-linecap="round"/>
  <circle cx="200" cy="140" r="10" fill="#ff6b35"/>
  <text x="200" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#5b2a86" text-anchor="middle" letter-spacing="1">RGB SMART</text>
  <!-- Screw Base Rings -->
  <rect x="165" y="275" width="70" height="12" rx="4" fill="url(#screwBase)"/>
  <rect x="168" y="290" width="64" height="12" rx="4" fill="url(#screwBase)"/>
  <rect x="172" y="305" width="56" height="12" rx="4" fill="url(#screwBase)"/>
  <!-- Base Contact Point -->
  <path d="M 180 320 L 220 320 L 210 330 L 190 330 Z" fill="#334155"/>
</svg>