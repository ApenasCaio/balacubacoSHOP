<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="chargerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#ff6b35" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Plug Pins -->
  <rect x="160" y="55" width="16" height="50" rx="4" fill="#94a3b8"/>
  <rect x="224" y="55" width="16" height="50" rx="4" fill="#94a3b8"/>
  <!-- Charger Main Block -->
  <rect x="120" y="95" width="160" height="210" rx="28" fill="url(#chargerBody)" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="2"/>
  <!-- 65W GaN Badge -->
  <rect x="145" y="130" width="110" height="34" rx="8" fill="#5b2a86"/>
  <text x="200" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">65W GaN</text>
  <!-- USB Type-C Port 1 -->
  <rect x="155" y="195" width="90" height="26" rx="13" fill="#0f172a" stroke="#ff6b35" stroke-width="2"/>
  <rect x="175" y="206" width="50" height="4" rx="2" fill="#ff6b35"/>
  <text x="200" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#64748b" text-anchor="middle">USB-C1 (PD 65W)</text>
  <!-- USB Type-C Port 2 -->
  <rect x="155" y="245" width="90" height="26" rx="13" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="175" y="256" width="50" height="4" rx="2" fill="#94a3b8"/>
  <text x="200" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#64748b" text-anchor="middle">USB-C2 (PD 30W)</text>
</svg>