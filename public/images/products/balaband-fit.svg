<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="watchCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24143a"/>
      <stop offset="100%" stop-color="#0f071c"/>
    </linearGradient>
    <linearGradient id="watchScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Silicone Strap Top & Bottom -->
  <rect x="155" y="30" width="90" height="90" rx="14" fill="url(#strapGrad)"/>
  <rect x="155" y="280" width="90" height="90" rx="14" fill="url(#strapGrad)"/>
  <!-- Watch Case (Square with rounded corners) -->
  <rect x="130" y="100" width="140" height="180" rx="34" fill="url(#watchCase)" filter="url(#shadow)" stroke="#5b2a86" stroke-width="2.5"/>
  <!-- Watch Screen Display -->
  <rect x="140" y="112" width="120" height="156" rx="24" fill="#090412"/>
  <!-- Activity Ring / Metrics -->
  <circle cx="200" cy="170" r="38" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6"/>
  <circle cx="200" cy="170" r="38" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="160 80" stroke-linecap="round"/>
  <text x="200" y="176" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">10:42</text>
  <!-- Heart rate & Steps -->
  <text x="200" y="225" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">♥ 74 bpm</text>
  <text x="200" y="242" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">8.420 passos</text>
  <!-- Crown Button -->
  <rect x="270" y="145" width="8" height="24" rx="3" fill="#5b2a86"/>
</svg>