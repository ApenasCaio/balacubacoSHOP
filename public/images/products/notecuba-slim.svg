<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="slimLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="slimScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="slimBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#64748b" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Laptop Lid -->
  <rect x="75" y="75" width="250" height="165" rx="10" fill="url(#slimLid)" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Screen -->
  <rect x="83" y="83" width="234" height="149" rx="5" fill="url(#slimScreen)"/>
  <!-- Minimal Graphic on Screen -->
  <path d="M83 175 Q160 130 317 170 L317 232 L83 232 Z" fill="rgba(255,255,255,0.2)"/>
  <text x="200" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">SLIM AIR</text>
  <!-- Camera -->
  <circle cx="200" cy="79" r="2.5" fill="#334155"/>
  <!-- Ultra-thin Base -->
  <polygon points="45,260 355,260 325,240 75,240" fill="url(#slimBase)" stroke="#94a3b8" stroke-width="1"/>
  <rect x="45" y="260" width="310" height="7" rx="3.5" fill="#64748b"/>
  <rect x="180" y="260" width="40" height="3" rx="1.5" fill="#cbd5e1"/>
</svg>