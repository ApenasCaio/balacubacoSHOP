<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d134b"/>
      <stop offset="50%" stop-color="#1e0c33"/>
      <stop offset="100%" stop-color="#0e051a"/>
    </linearGradient>
    <linearGradient id="ledGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ffc93c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#5b2a86" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Powerbank Body -->
  <rect x="110" y="60" width="180" height="280" rx="32" fill="url(#bankGrad)" filter="url(#shadow)" stroke="#5b2a86" stroke-width="2.5"/>
  <!-- Top Port Bay -->
  <rect x="135" y="75" width="130" height="30" rx="8" fill="#090310"/>
  <rect x="150" y="85" width="30" height="10" rx="3" fill="#ff6b35"/>
  <rect x="190" y="86" width="20" height="8" rx="4" fill="#64748b"/>
  <rect x="220" y="85" width="30" height="10" rx="3" fill="#ff6b35"/>
  <!-- LED Digital Display Battery % -->
  <rect x="145" y="140" width="110" height="60" rx="14" fill="#08020e" stroke="#381559" stroke-width="1.5"/>
  <text x="195" y="178" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="url(#ledGrad)" text-anchor="middle">98%</text>
  <circle cx="236" cy="162" r="3" fill="#ffc93c"/>
  <!-- Fast Charge Text & Specs -->
  <text x="200" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">20.000 mAh</text>
  <text x="200" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">PD 22.5W FAST CHARGE</text>
  <!-- Power Button on Side -->
  <rect x="288" y="140" width="6" height="28" rx="3" fill="#ff6b35"/>
</svg>