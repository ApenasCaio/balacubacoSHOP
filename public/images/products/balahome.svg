<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="voiceRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#818cf8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Fabric Mesh Sphere Body -->
  <circle cx="200" cy="200" r="110" fill="url(#orbGrad)" filter="url(#shadow)" stroke="#334155" stroke-width="2"/>
  <!-- Top Glass Touch Surface with LED Glowing Ring -->
  <ellipse cx="200" cy="130" rx="65" ry="24" fill="#09090b" stroke="url(#voiceRing)" stroke-width="4"/>
  <!-- Glowing Interactive Pulse Center -->
  <ellipse cx="200" cy="130" rx="35" ry="12" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="200" cy="130" r="6" fill="#38bdf8"/>
  <!-- Fabric Texture lines -->
  <path d="M 120 230 Q 200 280 280 230" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <path d="M 110 200 Q 200 250 290 200" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <text x="200" y="245" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">BALAHOME AI</text>
</svg>