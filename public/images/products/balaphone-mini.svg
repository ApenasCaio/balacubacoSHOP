<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="miniBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="miniScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Frame -->
  <rect x="125" y="60" width="150" height="280" rx="30" fill="url(#miniBody)" filter="url(#shadow)" stroke="#38bdf8" stroke-width="2"/>
  <!-- Screen -->
  <rect x="133" y="68" width="134" height="264" rx="22" fill="url(#miniScreen)"/>
  <!-- Camera punch-hole -->
  <circle cx="200" cy="80" r="5" fill="#0f172a"/>
  <!-- Graphic wallpaper waves -->
  <path d="M133 220 Q190 180 267 230 L267 332 L133 332 Z" fill="rgba(255,255,255,0.2)"/>
  <!-- Badge 5G -->
  <rect x="180" y="160" width="40" height="22" rx="6" fill="rgba(15,23,42,0.4)"/>
  <text x="200" y="176" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">5G</text>
  <!-- Indicator bar -->
  <rect x="175" y="320" width="50" height="4" rx="2" fill="rgba(255,255,255,0.7)"/>
</svg>