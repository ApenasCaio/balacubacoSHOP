<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrinho - BalacubacoSHOP</title>
<link rel="icon" href="/images/logo.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main class="container">
  <h1>Meu carrinho</h1>
  <div class="grid-2">
    <div class="card" id="cart-items">
      <p class="text-muted">Carregando carrinho...</p>
    </div>
    <div class="card">
      <h3 class="mt-0">Resumo do pedido</h3>
      <div class="flex-between"><span>Subtotal</span><strong id="cart-subtotal">R$ 0,00</strong></div>
      <div class="flex-between"><span>Frete</span><strong>Gratis</strong></div>
      <hr>
      <div class="flex-between"><span>Total</span><strong id="cart-total">R$ 0,00</strong></div>
      <a href="/checkout.html" class="btn btn-primary btn-block" style="margin-top:16px;text-align:center;">Finalizar compra</a>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/app.js"></script>
<script src="/js/carrinho.js"></script>
</body>
</html>
