<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finalizar compra - BalacubacoSHOP</title>
<link rel="icon" href="/images/logo.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main class="container">
  <h1>Finalizar compra</h1>
  <div class="grid-2">
    <div class="card">
      <h3 class="mt-0">Endereco de entrega</h3>
      <div id="checkout-alert"></div>
      <form id="checkout-form">
        <label>Endereco completo</label>
        <textarea id="address" placeholder="Rua, numero, bairro, cidade/UF" required></textarea>
        <label>Forma de pagamento</label>
        <select id="payment">
          <option>Cartao de credito</option>
          <option>Pix</option>
          <option>Boleto</option>
        </select>
        <button class="btn btn-primary btn-block" type="submit">Confirmar pedido</button>
      </form>
    </div>
    <div class="card" id="checkout-summary">
      <h3 class="mt-0">Resumo</h3>
      <p class="text-muted">Carregando...</p>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/app.js"></script>
<script src="/js/checkout.js"></script>
</body>
</html>
