<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar - BalacubacoSHOP</title>
<link rel="icon" href="/images/logo.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<main class="container">
  <div class="card form-narrow">
    <h1 class="mt-0 center">Entrar na minha conta</h1>
    <div id="login-alert"></div>
    <form id="login-form">
      <label>Email</label>
      <input type="text" id="email" name="email" placeholder="seuemail@example.com" required>
      <label>Senha</label>
      <input type="password" id="password" name="password" placeholder="Sua senha" required>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    </form>
    <p class="helper-text center" style="margin-top:16px;">Nao tem conta? <a href="/cadastro.html">Cadastre-se</a></p>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/app.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
